<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Вход в админку</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="backend"><main class="container" style="max-width:400px;margin-top:10vh">
<h1>Вход в админку</h1>
{% with messages = get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
<form method="post" class="form">
  <label>Логин <input name="login" required></label>
  <label>Пароль <input name="password" type="password" required></label>
  <button type="submit">Войти</button>
</form>
</main></body></html>
