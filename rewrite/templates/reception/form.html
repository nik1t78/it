{% extends 'base.html' %}
{% block title %}Обращения граждан{% endblock %}
{% block content %}
<h1>Обращения граждан</h1>
<form method="post" class="form">
  <label>Тема <input name="subject" required></label>
  <label>ФИО <input name="fio" required></label>
  <label>Адрес <input name="address"></label>
  <label>Телефон <input name="phone"></label>
  <label>E-mail <input name="email" type="email"></label>
  <label>Текст обращения <textarea name="body" rows="8" required></textarea></label>
  <button type="submit">Отправить</button>
</form>
{% endblock %}
