name: IT 2.0 Laravel CI

on:
  push:
    branches: [it-2.0]
    paths:
      - 'it-2.0/**'
      - '.github/workflows/it2-ci.yml'
  pull_request:
    branches: [it-2.0]
    paths:
      - 'it-2.0/**'
      - '.github/workflows/it2-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: it-2.0
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, openssl
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP formatting
        run: composer lint
      - name: Run feature tests
        run: composer test
